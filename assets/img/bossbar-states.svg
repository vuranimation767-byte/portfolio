<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-label="BossBar HUD color states: green above 12 hours, yellow between 12 and 2 hours, red under 2 hours with heartbeat pulse and alternating overlay styles">
  <defs>
    <linearGradient id="gG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ce87c"/><stop offset="1" stop-color="#17b257"/>
    </linearGradient>
    <linearGradient id="gY" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd75e"/><stop offset="1" stop-color="#e0a83c"/>
    </linearGradient>
    <linearGradient id="gR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b5e"/><stop offset="1" stop-color="#d32e2e"/>
    </linearGradient>
    <linearGradient id="gRGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a4d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d32e2e" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="cuts" width="9" height="10" patternUnits="userSpaceOnUse">
      <rect width="2" height="10" fill="#000" opacity="0.09"/>
    </pattern>
    <style>
      .HB { animation: hbpulse 1.1s ease-in-out infinite; }
      @keyframes hbpulse { 0%,100% { opacity: .85; } 14% { opacity: 1; } 26% { opacity: .8; } 42% { opacity: 1; } }
      .txt { paint-order: stroke; stroke: #050508; stroke-width: 3px; }
    </style>
  </defs>

  <!-- ============ ROW 1 · GREEN ============ -->
  <g>
    <rect x="6" y="8" width="218" height="20" rx="10" fill="#0f2417" stroke="#1d5a35"/>
    <circle cx="20" cy="18" r="4" fill="#2bd96a"/>
    <text x="32" y="22" font-size="11" font-weight="700" fill="#7ff0a8" letter-spacing="1">GREEN · MORE THAN 12 HOURS</text>
    <rect x="6" y="34" width="868" height="56" rx="10" fill="#101016" stroke="#000" stroke-opacity="0.65"/>
    <line x1="6" y1="35.5" x2="874" y2="35.5" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="6" y="34" width="672" height="56" rx="10" fill="url(#gG)"/>
    <rect x="6" y="34" width="672" height="56" rx="10" fill="url(#cuts)"/>
    <text class="txt" x="646" y="69" text-anchor="end" font-size="17" font-weight="700" fill="#08240f">18h 35m</text>
    <line x1="440" y1="40" x2="440" y2="84" stroke="#ffffff" stroke-opacity="0.10" stroke-dasharray="3 4"/>
    <text x="440" y="104" text-anchor="middle" font-size="9" fill="#6f6a80">12h</text>
  </g>

  <!-- ============ ROW 2 · YELLOW ============ -->
  <g>
    <rect x="6" y="116" width="262" height="20" rx="10" fill="#251f0d" stroke="#5a4920"/>
    <circle cx="20" cy="126" r="4" fill="#f2c94c"/>
    <text x="32" y="130" font-size="11" font-weight="700" fill="#ffd75e" letter-spacing="1">YELLOW · BETWEEN 12 AND 2 HOURS</text>
    <rect x="6" y="142" width="868" height="56" rx="10" fill="#101016" stroke="#000" stroke-opacity="0.65"/>
    <line x1="6" y1="143.5" x2="874" y2="143.5" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="6" y="142" width="297" height="56" rx="10" fill="url(#gY)"/>
    <rect x="6" y="142" width="297" height="56" rx="10" fill="url(#cuts)"/>
    <text class="txt" x="286" y="177" text-anchor="end" font-size="17" font-weight="700" fill="#2b1d05">8h 12m</text>
    <line x1="79" y1="148" x2="79" y2="192" stroke="#ffffff" stroke-opacity="0.14" stroke-dasharray="3 4"/>
    <text x="79" y="212" text-anchor="middle" font-size="9" fill="#6f6a80">2h</text>
    <line x1="440" y1="148" x2="440" y2="192" stroke="#ffffff" stroke-opacity="0.06" stroke-dasharray="3 4"/>
  </g>

  <!-- ============ ROW 3 · RED — HEARTBEAT + OVERLAYS ============ -->
  <g>
    <rect x="6" y="228" width="868" height="196" rx="14" fill="#170a0d" stroke="#4a1d24"/>
    <circle cx="28" cy="252" r="4" fill="#ff4d4d" class="HB"/>
    <text x="40" y="257" font-size="12" font-weight="700" fill="#ff8f8f" letter-spacing="1">RED · UNDER 2 HOURS — ❤ HEARTBEAT PULSE · OVERLAY STYLE ALTERNATES</text>

    <!-- PROGRESS -->
    <text x="20" y="286" font-size="11" fill="#d9a0a0" font-family="Consolas, monospace">BossBar.OverlayStyle.PROGRESS</text>
    <rect class="HB" x="18" y="294" width="404" height="56" rx="10" fill="url(#gRGlow)" opacity="0.5"/>
    <rect x="18" y="294" width="404" height="56" rx="10" fill="#101016" stroke="#000" stroke-opacity="0.65"/>
    <line x1="18" y1="295.5" x2="422" y2="295.5" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect class="HB" x="18" y="294" width="64" height="56" rx="10" fill="url(#gR)"/>
    <rect x="18" y="294" width="64" height="56" rx="10" fill="url(#cuts)"/>
    <text class="txt" x="98" y="329" font-size="16" font-weight="700" fill="#ffd9d4">1h 47m</text>

    <!-- NOTCHED_10 -->
    <text x="452" y="286" font-size="11" fill="#d9a0a0" font-family="Consolas, monospace">BossBar.OverlayStyle.NOTCHED_10</text>
    <rect class="HB" x="450" y="294" width="424" height="56" rx="10" fill="url(#gRGlow)" opacity="0.5"/>
    <rect x="450" y="294" width="424" height="56" rx="10" fill="#101016" stroke="#000" stroke-opacity="0.65"/>
    <line x1="450" y1="295.5" x2="874" y2="295.5" stroke="#ffffff" stroke-opacity="0.09"/>
    <!-- 10 segment gaps -->
    <rect class="HB" x="450" y="294" width="64" height="56" fill="url(#gR)"/>
    <rect class="HB" x="450" y="294" width="64" height="56" fill="url(#cuts)"/>
    <g fill="#101016">
      <rect x="492.4" y="294" width="3" height="56"/><rect x="534.8" y="294" width="3" height="56"/>
      <rect x="577.2" y="294" width="3" height="56"/><rect x="619.6" y="294" width="3" height="56"/>
      <rect x="662" y="294" width="3" height="56"/><rect x="704.4" y="294" width="3" height="56"/>
      <rect x="746.8" y="294" width="3" height="56"/><rect x="789.2" y="294" width="3" height="56"/>
      <rect x="831.6" y="294" width="3" height="56"/>
    </g>
    <text class="txt" x="530" y="329" font-size="16" font-weight="700" fill="#ffd9d4">1h 47m</text>

    <!-- pulse legend -->
    <text x="440" y="396" text-anchor="middle" font-size="11" fill="#8f8aa5">Color <tspan fill="#ff8f8f" font-family="Consolas, monospace">BossBar.Color.RED</tspan> + heartbeat pulse — bar breathes on a ~1s heartbeat while the player is critical</text>
  </g>
</svg>
